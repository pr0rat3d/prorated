workflows:
  ios-app-store:
    name: ProRated iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - app_store
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.prorated
      vars:
        BUNDLE_ID: "app.prorated"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22.13.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web assets
        script: npm run build

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Set version number
        script: |
          agvtool new-marketing-version 1.4
          # Ask App Store Connect for the real highest build number instead of
          # trusting a hardcoded value in this file — a build can be accepted
          # by Apple even when Codemagic's own post-processing step reports
          # "failed" (transient errors after a successful upload), silently
          # burning whatever number was hardcoded here. Querying Apple directly
          # means every trigger is always correct, with nothing to remember or
          # bump by hand.
          #
          # get-latest-app-store-build-number only looks at builds tied to a
          # formally submitted App Store *version* (public release history) —
          # we're TestFlight-only right now, so that undercounts every build
          # we've actually uploaded. get-latest-testflight-build-number with
          # --all-versions is the one that actually sees every TestFlight
          # upload across every marketing version, which is what we need.
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number 6785617187 \
            --all-versions \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @env:APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
        working_directory: ios/App

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS
        script: |
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>5ZD8684X8H</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>app.prorated</key>
                  <string>ProRated App Store</string>
              </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath /tmp/ProRated.xcarchive \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath /tmp/ProRated.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/ProRated.xcarchive/Products/Applications/*.app

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # No beta_groups here — "new tester" is an Internal Testing group,
        # and internal testers automatically get access to every new build
        # the moment it finishes processing. Apple's API actively rejects
        # trying to explicitly assign a build to an internal group
        # ("Cannot add internal group to a build") — beta_groups is only
        # for External Testing groups, which do need per-build assignment.

  android-play-store:
    name: ProRated Android Play Store
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      android_signing:
        - prorated_keystore
      vars:
        PACKAGE_NAME: "app.prorated"
      node: 22.13.0
      java: 21

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web assets
        script: npm run build

      - name: Capacitor sync
        script: npx cap sync android

      - name: Set version code
        script: |
          cd android
          sed "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" app/build.gradle > app/build.gradle.tmp
          mv app/build.gradle.tmp app/build.gradle

      - name: Build Android release
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
